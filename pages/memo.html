<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <link rel="stylesheet" href="../asetts/style.css" />
    <link rel="stylesheet" href="../asetts/util.css" />
    <link rel="icon" href="../asetts/img/favicon/favicon.png" sizes="32x32" />
  </head>
  <body>
    <header class="HeaderInfo DefoultHeader">
      <button id="memoToolsToggle" class="sidebarToggleButton memoToolsToggleButton">≡</button>
      <h2 class="HeaderText" id="HeaderText"></h2>
    </header>

    <div id="memoToolsBackdrop" class="DialogBackDrop memoToolsBackdrop hidden"></div>
    <div id="memoToolsDialog" class="MessageDialog memoToolsDialog hidden" aria-hidden="true">
      <div class="memoToolsDialogHeader">
        <p class="dialogMessage">ツール</p>
      </div>
      <div class="memoToolsSearchRow">
        <input
          type="text"
          id="SearchWordForm"
          class="FormInfo"
          maxlength="100"
          placeholder="検索ワード"
        />
        <button class="ButtonInfo" onclick="SearchEvent(); CloseMemoToolsDialog();">検索</button>
        <button class="ButtonInfo" onclick="ClearSearch()">クリア</button>
      </div>
      <div class="memoToolsButtonGrid">
        <button class="ButtonInfo" onclick="DeleteLearningInfo()">投稿削除</button>
        <button class="ButtonInfo" onclick="PreateLearningInfo()">投稿出力</button>
        <button class="ButtonInfo" onclick="ScrollTop()">一番上へ</button>
        <button class="ButtonInfo" onclick="ScrollBottom()">一番下へ</button>
      </div>
      <div class="memoToolsDialogFooter">
        <button class="ButtonInfo" onclick="CloseMemoToolsDialog()">閉じる</button>
      </div>
    </div>

    <div id="postList"></div>

    <footer>
      <div class="footerContainer">
        <div class="footerInputContainer">
          <div>
            <input
              type="text"
              id="titleInput"
              class="FormInfo w-500"
              maxlength="100"
              placeholder="投稿タイトル"
            />
          </div>
          <div>
            <input
              type="text"
              id="SelectFileNameForm"
              class="FormInfo w-500"
              maxlength="100"
              placeholder="選択された画像名（最大4枚）"
              disabled
            />
          </div>
        </div>

        <div class="footerTextAreaContainer">
          <div>
            <textarea
              id="bodyInput"
              placeholder="本文"
              class="TextAreaForm FormInfo w-500"
              style="height: 100px;"
            ></textarea>
          </div>
        </div>

        <div class="footerBtnList">
          <button onclick="addPost()" class="ButtonInfo">投稿</button>
          <div>
            <label for="imageInput" class="ButtonInfo ImgSelectButton">画像を選択</label>
            <input
              type="file"
              id="imageInput"
              accept="image/*"
              multiple
              style="display: none"
            />
          </div>
          <button onclick="clearEvent()" class="ButtonInfo">クリア</button>
          <button onclick="CreateTextArea()" class="ButtonInfo">入力欄拡大</button>
          <button onclick="backPage()" id="backPageButton" class="ButtonInfo">戻る</button>
        </div>
      </div>
    </footer>

    <script src="../script/public.js"></script>
    <script src="../script/utility.js"></script>
    <script src="../script/ImgPreviewDialog.js"></script>
    <script src="../script/main.js"></script>
  </body>
</html>
