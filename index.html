<!DOCTYPE html>
<html lang="ja">
  <head name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8" />
    <title>メモサイト</title>
    <link rel="stylesheet" href="asetts/style.css" />
    <link rel="icon" href="asetts/img/favicon/favicon.png" sizes="32x32" />
  </head>
  <body>
    <header class="HeaderInfo DefoultHeader">
      <h2 class="HeaderText">メニュー</h2>
      <ul class="ButtonWrapper">
        <li>
          <button class="ButtonInfo" onclick="CreateFullBackUp()">
            バックアップ作成
          </button>
        </li>
        <li>
          <input type="file" id="csvFile" accept=".csv" style="display: none" />
          <button class="ButtonInfo" onclick="ReadBackUp()">
            バックアップ復元
          </button>
        </li>
        <li>
          <input type="file" id="csvFile" accept=".csv" style="display: none" />
          <button class="ButtonInfo" onclick="AllDataDelete()">
            データ削除
          </button>
        </li>
        <li>
          <button class="ButtonInfo" onclick="UserInfo()">
            ユーザー設定
          </button>
        </li>
      </ul>
    </header>

    <main>
      <aside class="sideBar">
        <div id="SectionContainer" class="SectionContainer">
          <h3 class="SectionLabel">メニュー項目</h3>
        </div>
      </aside>
      <div class="menuList">
        <div id="menuContainer" class="menuContainer"></div>
      </div>
    </main>
    <script src="script/public.js"></script>
    <script src="script/utility.js"></script>
    <script src="script/menu.js"></script>
  </body>
</html>
