<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>メモサイト</title>
    <link rel="stylesheet" href="asetts/style.css" />
    <link rel="stylesheet" href="asetts/util.css" />
    <link rel="icon" href="asetts/img/favicon/favicon.png" sizes="32x32" />
  </head>
  <body>
    <header class="HeaderInfo DefoultHeader">
      <button id="sidebarToggle" class="sidebarToggleButton">≡</button>
      <h2 class="HeaderText">メニュー</h2>
    </header>

    <main>
      <aside class="sideBar" id="sideBar">
        <!-- モバイル用：サイドバー内にヘッダーボタンを複製 -->
        <div id="sidebarActions" class="sidebarActions">
          <button class="ButtonInfo sidebarActionBtn" onclick="CreateFullBackUp()">バックアップ作成</button>
          <button class="ButtonInfo sidebarActionBtn" onclick="ReadBackUp()">バックアップ復元</button>
          <button class="ButtonInfo sidebarActionBtn" onclick="AllDataDelete()">データ削除</button>
          <hr class="sidebarDivider" />
        </div>
        <div id="SectionContainer" class="SectionContainer">
          <h3 class="SectionLabel">メニュー項目</h3>
        </div>
      </aside>
      <div class="menuList">
        <div id="menuContainer" class="menuContainer"></div>
      </div>
    </main>
    <script src="script/public.js"></script>
    <script src="script/utility.js"></script>
    <script src="script/menu.js"></script>
  </body>
</html>
